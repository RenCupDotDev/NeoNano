# neonano configuration
# Edit this file, then press Alt+K (or type :reload) to apply.
# Press Alt+I (or type :config) to open it inside neonano.
#
# Key names: ctrl+<letter>, alt+<key>, f1..f12, tab, backtab, enter, esc,
#            backspace, delete, insert, home, end, pageup, pagedown,
#            up, down, left, right, and any single character.
# Set a binding to "" to disable it. A list of bindings is allowed.

theme = "neonano"               # a file name in themes/ (yours or bundled)

[editor]
tab_width = 4
use_spaces = true               # Tab inserts spaces instead of a tab character
auto_indent = true              # Enter keeps the indentation of the current line
scroll_margin = 2               # lines kept visible above and below the cursor
undo_levels = 500
autosave_seconds = 0            # 0 disables autosave
trim_trailing_spaces = false    # remove trailing spaces when saving
final_newline = true            # end saved files with a newline

[view]
line_numbers = "left"           # "left", "right" or "none"
line_number_width = "auto"      # "auto" or a fixed number of digits
relative_numbers = false        # show distance from the cursor instead
gutter_separator = "|"
current_line = true             # highlight the line the cursor is on
show_header = true
header_left = " neonano  {name}{modified}{mark}"
header_right = "{row}:{col}  {lines} lines "

[colors]
# Overrides on top of the theme. Any role from themes/*.toml works here:
# text = "#ffffff"
# background = "#000000"

[plugins]
enabled = ["wordcount", "snippets"]   # folders in plugins/ (yours or bundled)

[keys]
palette = "f1"
save = "ctrl+s"
quit = "ctrl+x"
undo = "ctrl+z"
redo = "ctrl+y"
find = "ctrl+f"
find_next = "f3"
goto_line = "ctrl+g"
mark = "ctrl+t"
select_all = "alt+a"
cut = "ctrl+k"
copy = "alt+c"
paste = "ctrl+u"
delete_line = "ctrl+d"
duplicate_line = "alt+d"
indent = "tab"
unindent = "backtab"
insert_newline = "enter"
delete_back = "backspace"
delete_forward = "delete"
move_left = "left"
move_right = "right"
move_up = "up"
move_down = "down"
line_start = ["home", "ctrl+a"]
line_end = ["end", "ctrl+e"]
word_left = "alt+b"
word_right = "alt+f"
buffer_start = "alt+<"
buffer_end = "alt+>"
page_up = "pageup"
page_down = "pagedown"
cancel = "esc"
toggle_line_numbers = "alt+n"
toggle_relative = "alt+l"
toggle_current_line = "alt+h"
cycle_theme = "alt+t"
reload_config = "alt+k"
open_config = "alt+i"
redraw = "ctrl+l"
word_count = "alt+w"
snippet_prompt = "alt+s"
