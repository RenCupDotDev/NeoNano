[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neonano"
version = "0.2.2"
description = "A terminal text editor: nano-style editing with a ':' command palette"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = []

[project.scripts]
nnano = "neonano.main:run"

[tool.setuptools.packages.find]
include = ["neonano*"]

[tool.setuptools.package-data]
neonano = ["config.default.toml", "themes/*.toml", "plugins/*/app.py", "plugins/*/resources/*", "assets/*"]
